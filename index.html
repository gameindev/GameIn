<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GameIn - Coming Soon</title>
    <style>
      @font-face {
        font-family: "Exo2";
        src: url(/assets/Exo2-Regular.ttf) format("truetype");
        font-weight: 400;
        font-style: normal;
      }
      :root {
        --text: #ffffff;
        --overlay: rgba(15, 22, 30, 0.22);
        --subtitle: rgba(255, 255, 255, 0.9);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: "Exo2", "Helvetica Neue", Arial, sans-serif;
        background: #111;
      }

      .banner {
        position: relative;
        width: 100%;
        height: 100%;
        isolation: isolate;
      }

      .bg-video {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        z-index: -2;
      }

      .banner::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(
          90deg,
          rgba(25, 241, 207, 0.2) 0%,
          var(--overlay) 50%,
          rgba(87, 40, 245, 0.2) 100%
        );
        z-index: -1;
        pointer-events: none;
      }

      .content {
        position: absolute;
        top: 22%;
        left: 12%;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 14px;
        color: var(--text);
        max-width: 50vw;
      }

      .logo {
        width: min(290px, 62vw);
        height: auto;
        filter: drop-shadow(0 8px 24px rgba(0, 0, 0, 0.25));
      }

      .heroTitle {
        font-size: 2.75rem;
        margin: 3.438rem 0;
      }

      .heroSubTitle {
        font-size: 1.875rem;
        margin: 0 0 3.438rem 0;
        font-weight: 300;
      }

      .coming-soon {
        font-size: clamp(1.25rem, 1rem + 1.5vw, 2.2rem);
        letter-spacing: 0.06em;
        text-transform: uppercase;
        font-weight: 700;
        color: var(--subtitle);
        text-shadow: 0 5px 18px rgba(0, 0, 0, 0.28);
      }

      @media (max-width: 768px) {
        .content {
          top: 18%;
          left: 8%;
          gap: 10px;
          max-width: 100%;
        }
        .heroTitle {
          font-size: 2rem;
          margin: 2.438rem 0;
        }

        .heroSubTitle {
          font-size: 1.5rem;
          margin: 0 0 2.438rem 0;
          font-weight: 300;
        }
      }
    </style>
  </head>
  <body>
    <main class="banner">
      <video class="bg-video" autoplay muted loop playsinline>
        <source src="./assets/gameIn-vid.mp4" type="video/mp4" />
      </video>

      <section class="content" aria-label="GameIn Coming Soon Banner">
        <img class="logo" src="./assets/gamein-logo.svg" alt="GameIn" />
        <h2 class="heroTitle">Connecting creators &amp; brands worldwide</h2>
        <h3 class="heroSubTitle">
          Join the most powerful advertising marketplace and boost your success
        </h3>
        <p class="coming-soon">
          Coming <span style="color: #5ce5b0">Soon</span>
        </p>
      </section>
    </main>
  </body>
</html>
