# ---------------------------
# Redis Configuration Example
# ---------------------------

# Bind to all interfaces (so Docker container is reachable)
bind 0.0.0.0

# Require a password (change this!)
requirepass Allth3w@yuP35!

# Set a max memory limit (optional, useful for containers)
# Example: limit to 100MB and use LRU eviction
maxmemory 100mb
maxmemory-policy allkeys-lru

# Enable append-only file (AOF) persistence for durability
appendonly yes
appendfsync everysec

# Save the DB snapshot periodically (RDB persistence)
# Format: save <seconds> <changes>
save 900 1
save 300 10
save 60 10000

# Directory where Redis stores data
dir /data

# Log level and location
loglevel notice
logfile ""

# Enable protected mode only if you use password authentication
protected-mode yes

# Optional: Rename dangerous commands for security
# rename-command FLUSHALL ""
# rename-command FLUSHDB ""
# rename-command CONFIG ""
# rename-command SHUTDOWN ""
